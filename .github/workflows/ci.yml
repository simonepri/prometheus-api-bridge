name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5
        with:
          cache: true
      - name: Restore Go caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('mise.toml', 'src/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-
      - name: Restore Helm cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ~/.cache/prometheus-api-bridge/helm
          key: ${{ runner.os }}-${{ runner.arch }}-helm-${{ hashFiles('src/chart/Chart.lock', 'src/tests/**/*.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-helm-
      - run: mise run verify

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5
        with:
          cache: true
      - name: Restore Helm cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ~/.cache/prometheus-api-bridge/helm
          key: ${{ runner.os }}-${{ runner.arch }}-helm-${{ hashFiles('src/chart/Chart.lock', 'src/tests/**/*.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-helm-
      - name: Restore VPA source cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ~/.cache/prometheus-api-bridge/vpa
          key: ${{ runner.os }}-${{ runner.arch }}-vpa-${{ hashFiles('mise.toml', 'src/tests/vpa/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vpa-
      - run: mise run e2e
      - name: Upload Chainsaw report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: chainsaw-consumers
          path: .local/e2e/shared/chainsaw-report.xml
          if-no-files-found: warn
