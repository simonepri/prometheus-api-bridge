version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - cyclop
    - errorlint
    - exhaustive
    - funlen
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - wastedassign
  settings:
    cyclop:
      max-complexity: 15
    funlen:
      lines: 120
      statements: 70
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
  exclusions:
    generated: strict
    presets:
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
