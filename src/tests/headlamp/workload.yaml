apiVersion: v1
kind: Namespace
metadata:
  name: bridge-test
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: headlamp-data
spec:
  capacity:
    storage: 128Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: bridge-e2e-static
  hostPath:
    path: /tmp/prometheus-api-bridge/headlamp-data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headlamp-data
  namespace: bridge-test
spec:
  storageClassName: bridge-e2e-static
  volumeName: headlamp-data
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: headlamp-probe
  namespace: bridge-test
  labels:
    app: headlamp-probe
spec:
  containers:
    - name: probe
      image: busybox:1.38.0
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            dd if=/dev/zero of=/data/payload bs=64K count=16 conv=fsync >/dev/null 2>&1
            cat /data/payload >/dev/null
            wget -q -O /dev/null http://prometheus-api-bridge.observability.svc:9090/-/ready || true
            i=0
            while [ "${i}" -lt 50000 ]; do i=$((i + 1)); done
            sleep 1
          done
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 250m
          memory: 64Mi
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: headlamp-data
