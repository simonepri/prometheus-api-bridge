apiVersion: v1
kind: Namespace
metadata:
  name: bridge-test
---
apiVersion: v1
kind: Pod
metadata:
  name: otel-metric-emitter
  namespace: bridge-test
spec:
  containers:
    - name: emitter
      image: busybox:1.38.0
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            timestamp="$(date +%s)000000000"
            payload='{"resourceMetrics":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"bridge-consumer-e2e"}}]},"scopeMetrics":[{"scope":{"name":"bridge-e2e"},"metrics":[{"name":"bridge_test_queue_depth","gauge":{"dataPoints":[{"attributes":[{"key":"namespace","value":{"stringValue":"bridge-test"}},{"key":"deployment","value":{"stringValue":"hpa-worker"}}],"timeUnixNano":"'"${timestamp}"'","asDouble":10}]}},{"name":"kubelet_volume_stats_used_bytes","gauge":{"dataPoints":[{"attributes":[{"key":"namespace","value":{"stringValue":"bridge-test"}},{"key":"persistentvolumeclaim","value":{"stringValue":"headlamp-data"}}],"timeUnixNano":"'"${timestamp}"'","asDouble":1048576}]}},{"name":"kubelet_volume_stats_capacity_bytes","gauge":{"dataPoints":[{"attributes":[{"key":"namespace","value":{"stringValue":"bridge-test"}},{"key":"persistentvolumeclaim","value":{"stringValue":"headlamp-data"}}],"timeUnixNano":"'"${timestamp}"'","asDouble":134217728}]}}]}]}]}'
            wget -q -O /dev/null \
              --header='Content-Type: application/json' \
              --post-data="${payload}" \
              http://signoz-otel-collector.observability.svc:4318/v1/metrics
            sleep 5
          done
      resources:
        requests:
          cpu: 5m
          memory: 4Mi
        limits:
          memory: 16Mi
