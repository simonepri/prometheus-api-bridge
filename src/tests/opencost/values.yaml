clusterName: prometheus-api-bridge-e2e

opencost:
  exporter:
    defaultClusterId: prometheus-api-bridge-e2e
    prometheusDataSource:
      queryResolutionSeconds: 60
    extraEnv:
      PROM_CLUSTER_ID_LABEL: cluster
      CURRENT_CLUSTER_ID_FILTER_ENABLED: "true"
      KUBECOST_SCRAPE_INTERVAL: 5s
      PROMETHEUS_QUERY_TIMEOUT: 30s
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 512Mi
  prometheus:
    internal:
      enabled: false
    external:
      enabled: true
      url: http://prometheus-api-bridge.observability.svc:9090
  customPricing:
    enabled: true
    provider: custom
  ui:
    enabled: false
