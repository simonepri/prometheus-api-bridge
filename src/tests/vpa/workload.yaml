apiVersion: v1
kind: Namespace
metadata:
  name: bridge-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-burner
  namespace: bridge-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-burner
  template:
    metadata:
      labels:
        app: cpu-burner
    spec:
      containers:
        - name: burner
          image: busybox:1.38.0
          command:
            - /bin/sh
            - -c
            - while true; do :; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cpu-burner
  namespace: bridge-test
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cpu-burner
  updatePolicy:
    updateMode: "Off"
