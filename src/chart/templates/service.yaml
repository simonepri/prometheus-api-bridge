{{- if ne .Values.service.type "ClusterIP" }}
{{- fail "service.type must be ClusterIP; expose the bridge through an authenticated TLS ingress or service mesh" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prometheus-api-bridge.fullname" . }}
  labels:
    {{- include "prometheus-api-bridge.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "prometheus-api-bridge.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
